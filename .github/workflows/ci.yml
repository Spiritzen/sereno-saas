name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bundle exec brakeman --no-pager --no-exit-on-warn

      - name: Scan for known security vulnerabilities in gems used
        run: bundle exec bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bundle exec rubocop -f github

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SERENO_AR_ENCRYPTION_PRIMARY_KEY: ${{ secrets.SERENO_AR_ENCRYPTION_PRIMARY_KEY }}
          SERENO_AR_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.SERENO_AR_ENCRYPTION_DETERMINISTIC_KEY }}
          SERENO_AR_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.SERENO_AR_ENCRYPTION_KEY_DERIVATION_SALT }}
          # REDIS_URL: redis://localhost:6379/0
        run: |
          bundle exec rails db:test:prepare
          bundle exec rspec

  # B4 etage 1 (partie B) + etage 2 : preuve de conformite REJOUEE a chaque
  # push/PR -- XSD + Schematron EN 16931 (Mustang / KoSIT Validator) ET
  # PDF/A-3b (veraPDF) sur une facture (380) ET un avoir (381) dessus, en TVA
  # STANDARD et en FRANCHISE en base de TVA (art. 293 B du CGI), avec deux
  # auto-tests negatifs permanents (un XML et un PDF volontairement non
  # conformes doivent rester rejetes).
  #
  # Ce job couvre 3 DES 4 niveaux de conformite Factur-X vises par B4 :
  # structure (XSD) + regles metier (Schematron EN 16931) + PDF/A-3b
  # (veraPDF). Il NE couvre PAS les regles France CTC / BR-FR (aucun
  # scenario Mustang officiel n'existe a ce jour pour ce profil). Ne pas
  # presenter ce job comme une preuve de conformite complete.
  #
  # Le job consomme le scenario Mustang + le XSLT Schematron DEJA compile et
  # committes dans backend/vendor/facturx_validation_tooling/ -- il ne
  # recompile rien (la recompilation, quand le squelette evolue, est un
  # outil dev : `bundle exec rails conformite:compiler_schematron`).
  conformite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      # Versions EPINGLEES -- releases officielles (itplr-kosit/validator,
      # org.verapdf sur Maven Central). Ne jamais suivre "latest" : une
      # preuve de conformite doit rester reproductible d'un run a l'autre.
      MUSTANG_VERSION: "1.6.2"
      VERAPDF_VERSION: "1.30.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Set up Java (pour Mustang / KoSIT Validator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Mustang (KoSIT Validator)
        id: cache-mustang
        uses: actions/cache@v4
        with:
          path: backend/tmp/conformite_tools/mustang-validator.jar
          key: mustang-validator-${{ env.MUSTANG_VERSION }}

      - name: Download Mustang (KoSIT Validator, release officielle epinglee)
        if: steps.cache-mustang.outputs.cache-hit != 'true'
        run: |
          mkdir -p tmp/conformite_tools
          curl -sSfL -o tmp/conformite_tools/mustang-validator.jar \
            "https://github.com/itplr-kosit/validator/releases/download/v${MUSTANG_VERSION}/validator-${MUSTANG_VERSION}-standalone.jar"

      - name: Cache veraPDF CLI
        id: cache-verapdf
        uses: actions/cache@v4
        with:
          path: backend/tmp/conformite_tools/verapdf-cli.jar
          key: verapdf-cli-${{ env.VERAPDF_VERSION }}

      # Jamais l'installeur GUI officiel (IzPack) : resiste a l'automatisation
      # headless (constate a l'etage 2). org.verapdf.apps:cli sur Maven
      # Central publie un jar-with-dependencies autonome (Main-Class dans le
      # manifeste), utilisable directement en `java -jar`.
      - name: Download veraPDF CLI (Maven Central, jar autonome, version epinglee)
        if: steps.cache-verapdf.outputs.cache-hit != 'true'
        run: |
          mkdir -p tmp/conformite_tools
          curl -sSfL -o tmp/conformite_tools/verapdf-cli.jar \
            "https://repo1.maven.org/maven2/org/verapdf/apps/cli/${VERAPDF_VERSION}/cli-${VERAPDF_VERSION}.jar"

      - name: Prepare test database
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SERENO_AR_ENCRYPTION_PRIMARY_KEY: ${{ secrets.SERENO_AR_ENCRYPTION_PRIMARY_KEY }}
          SERENO_AR_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.SERENO_AR_ENCRYPTION_DETERMINISTIC_KEY }}
          SERENO_AR_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.SERENO_AR_ENCRYPTION_KEY_DERIVATION_SALT }}
        run: bundle exec rails db:test:prepare

      - name: Gate de conformite EN 16931 + PDF/A-3b (XSD + Schematron + veraPDF)
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SERENO_AR_ENCRYPTION_PRIMARY_KEY: ${{ secrets.SERENO_AR_ENCRYPTION_PRIMARY_KEY }}
          SERENO_AR_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.SERENO_AR_ENCRYPTION_DETERMINISTIC_KEY }}
          SERENO_AR_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.SERENO_AR_ENCRYPTION_KEY_DERIVATION_SALT }}
          MUSTANG_JAR_PATH: tmp/conformite_tools/mustang-validator.jar
          VERAPDF_JAR_PATH: tmp/conformite_tools/verapdf-cli.jar
        run: bundle exec rails conformite:valider
